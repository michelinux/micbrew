name: Build an Intel Homebrew bottle

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      formula:
        description: Canonical homebrew/core formula name (empty builds all missing configured formulae in dependency order)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  select-formulae:
    runs-on: ubuntu-latest
    outputs:
      wave_0: ${{ steps.select.outputs.wave_0 }}
      wave_1: ${{ steps.select.outputs.wave_1 }}
      wave_2: ${{ steps.select.outputs.wave_2 }}
      wave_3: ${{ steps.select.outputs.wave_3 }}
      wave_4: ${{ steps.select.outputs.wave_4 }}
      wave_5: ${{ steps.select.outputs.wave_5 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Plan dependency-ordered waves
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_FORMULA: ${{ inputs.formula }}
        run: |
          api_file="$RUNNER_TEMP/formula.json"
          artifacts_file="$RUNNER_TEMP/artifacts.json"

          if curl -fsSL --retry 3 https://formulae.brew.sh/api/formula.json -o "$api_file" &&
            gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/artifacts" -f per_page=100 |
              jq -c '[.[].artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id) | .name] | unique' \
              > "$artifacts_file"; then
            plan="$(python3 lib/plan-waves.py \
              --formulae-file formulae.json \
              --api-file "$api_file" \
              --artifacts-file "$artifacts_file" \
              --requested-formula "$REQUESTED_FORMULA" \
              --skip-existing \
              --max-waves 6)"
            for i in 0 1 2 3 4 5; do
              wave="$(jq -c ".waves[$i]" <<< "$plan")"
              echo "wave_$i=$wave" >> "$GITHUB_OUTPUT"
            done
          else
            echo "::warning::Unable to fetch Homebrew API or artifact catalog; falling back to flat wave_0."
            if [[ -n "$REQUESTED_FORMULA" ]]; then
              formulae="$(jq -nc --arg name "$REQUESTED_FORMULA" '[$name]')"
            else
              formulae="$(cat formulae.json)"
            fi
            formulae="$(jq -ce '
              if type == "array" and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9+_.-]*(@[0-9][0-9.]*)?$"))
              then unique
              else error("Enter canonical homebrew/core names in a JSON array")
              end
            ' <<< "$formulae")"
            echo "wave_0=$formulae" >> "$GITHUB_OUTPUT"
            for i in 1 2 3 4 5; do
              echo "wave_$i=[]" >> "$GITHUB_OUTPUT"
            done
          fi

  wave-0:
    needs: select-formulae
    if: needs.select-formulae.outputs.wave_0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.select-formulae.outputs.wave_0) }}
    concurrency:
      group: sequoia-intel-bottle-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-bottle
        with:
          formula: ${{ matrix.formula }}
          gh-token: ${{ github.token }}
          skip-existing: ${{ github.event_name == 'schedule' || inputs.formula == '' || matrix.formula != inputs.formula }}

  wave-1:
    needs: [select-formulae, wave-0]
    if: always() && !cancelled() && needs.select-formulae.result == 'success' && needs.select-formulae.outputs.wave_1 != '[]'
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.select-formulae.outputs.wave_1) }}
    concurrency:
      group: sequoia-intel-bottle-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-bottle
        with:
          formula: ${{ matrix.formula }}
          gh-token: ${{ github.token }}
          skip-existing: ${{ github.event_name == 'schedule' || inputs.formula == '' || matrix.formula != inputs.formula }}

  wave-2:
    needs: [select-formulae, wave-1]
    if: always() && !cancelled() && needs.select-formulae.result == 'success' && needs.select-formulae.outputs.wave_2 != '[]'
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.select-formulae.outputs.wave_2) }}
    concurrency:
      group: sequoia-intel-bottle-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-bottle
        with:
          formula: ${{ matrix.formula }}
          gh-token: ${{ github.token }}
          skip-existing: ${{ github.event_name == 'schedule' || inputs.formula == '' || matrix.formula != inputs.formula }}

  wave-3:
    needs: [select-formulae, wave-2]
    if: always() && !cancelled() && needs.select-formulae.result == 'success' && needs.select-formulae.outputs.wave_3 != '[]'
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.select-formulae.outputs.wave_3) }}
    concurrency:
      group: sequoia-intel-bottle-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-bottle
        with:
          formula: ${{ matrix.formula }}
          gh-token: ${{ github.token }}
          skip-existing: ${{ github.event_name == 'schedule' || inputs.formula == '' || matrix.formula != inputs.formula }}

  wave-4:
    needs: [select-formulae, wave-3]
    if: always() && !cancelled() && needs.select-formulae.result == 'success' && needs.select-formulae.outputs.wave_4 != '[]'
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.select-formulae.outputs.wave_4) }}
    concurrency:
      group: sequoia-intel-bottle-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-bottle
        with:
          formula: ${{ matrix.formula }}
          gh-token: ${{ github.token }}
          skip-existing: ${{ github.event_name == 'schedule' || inputs.formula == '' || matrix.formula != inputs.formula }}

  wave-5:
    needs: [select-formulae, wave-4]
    if: always() && !cancelled() && needs.select-formulae.result == 'success' && needs.select-formulae.outputs.wave_5 != '[]'
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.select-formulae.outputs.wave_5) }}
    concurrency:
      group: sequoia-intel-bottle-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-bottle
        with:
          formula: ${{ matrix.formula }}
          gh-token: ${{ github.token }}
          skip-existing: ${{ github.event_name == 'schedule' || inputs.formula == '' || matrix.formula != inputs.formula }}
